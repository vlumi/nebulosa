name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:md
      - run: npm run format:check
      - run: npx vitest run --reporter=verbose src/App.test.tsx
        env:
          NODE_OPTIONS: --max-old-space-size=1024
      - run: npm run build
